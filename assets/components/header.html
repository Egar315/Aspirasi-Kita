<!-- ==========================================
     HEADER & NAV: Navigasi Utama Aplikasi (Updated Premium Violet)
     ========================================== -->
<header
    class="sticky top-0 z-40 w-full bg-white/70 backdrop-blur-xl border-b border-slate-100 transition-all duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"
        aria-label="Navigasi Utama">

        <!-- Logo Brand -->
        <div class="flex items-center gap-2">
            <a href="#hero-banner"
                class="flex items-center gap-3 group focus:outline-none focus:ring-2 focus:ring-violet-600 focus:ring-offset-2 rounded-2xl p-1.5"
                aria-label="Aspirasi Kita Beranda">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-violet-100 group-hover:scale-105 group-hover:rotate-3 transition-all duration-300"
                    aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 brand-logo" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-slate-800">Aspirasi<span
                        class="text-violet-600">.Kita</span></span>
            </a>
        </div>

        <!-- Menu Tautan Utama (Hanya Desktop) -->
        <div class="hidden md:flex items-center gap-10">
            <a href="#hero-banner"
                class="text-sm font-bold text-slate-500 hover:text-violet-600 transition-colors focus:outline-none focus:ring-2 focus:ring-violet-600 rounded-md px-2.5 py-1">Beranda</a>
            <a href="#feed-aspirasi"
                class="text-sm font-bold text-slate-500 hover:text-violet-600 transition-colors focus:outline-none focus:ring-2 focus:ring-violet-600 rounded-md px-2.5 py-1">Feed
                Laporan</a>
            <a href="#filter-kategori"
                class="text-sm font-bold text-slate-500 hover:text-violet-600 transition-colors focus:outline-none focus:ring-2 focus:ring-violet-600 rounded-md px-2.5 py-1 font-semibold">Kategori</a>
        </div>

        <!-- Tombol Aksi Kanan (Identik 100% dengan image_bd6363.png) -->
        <div class="flex items-center gap-3.5">
            <!-- Tombol Pemicu Panel Aksesibilitas Cerdas -->
            <button id="btn-panel-aksesibilitas"
                class="flex items-center gap-3 px-5 py-2.5 border border-slate-200 text-slate-700 font-bold text-sm rounded-2xl hover:bg-slate-50 hover:border-violet-400 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-violet-600 focus:ring-offset-2"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="panel-aksesibilitas"
                aria-label="Buka Panel Aksesibilitas Cerdas">
                <!-- Ikon SVG Dua Orang / People Group Sesuai Gambar -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-violet-600 panel-icon" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="hidden sm:inline">Aksesibilitas</span>
            </button>

            <!-- Tombol Shortcut Tulis Aspirasi -->
            <button onclick="toggleReportModal(true)"
                class="px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm rounded-2xl shadow-md shadow-violet-100 hover:shadow-lg hover:shadow-violet-200 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-violet-600 focus:ring-offset-2"
                aria-label="Tulis Laporan Aspirasi Baru">
                Tulis Laporan
            </button>
        </div>

    </nav>
</header>
