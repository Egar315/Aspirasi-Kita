<!-- ==========================================
     HEADER & NAV: Navigasi Utama Aplikasi
     ========================================== -->
<header class="sticky top-0 z-40 w-full bg-white/70 backdrop-blur-xl border-b border-slate-100 transition-all duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between" aria-label="Navigasi Utama">
        
        <!-- Logo Brand -->
        <div class="flex items-center gap-2">
            <a href="#hero-banner" class="flex items-center gap-3 group focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-2 rounded-xl p-1.5" aria-label="Aspirasi Kita Beranda">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-brand-100 group-hover:scale-105 group-hover:rotate-3 transition-all duration-300" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 brand-logo" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-slate-800">Aspirasi<span class="text-brand-600">.Kita</span></span>
            </a>
        </div>

        <!-- Menu Tautan Utama (Hanya Desktop) -->
        <div class="hidden md:flex items-center gap-10">
            <a href="#hero-banner" class="text-sm font-bold text-slate-500 hover:text-brand-600 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-600 rounded-md px-2.5 py-1">Beranda</a>
            <a href="#feed-aspirasi" class="text-sm font-bold text-slate-500 hover:text-brand-600 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-600 rounded-md px-2.5 py-1">Feed Laporan</a>
            <a href="#filter-kategori" class="text-sm font-bold text-slate-500 hover:text-brand-600 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-600 rounded-md px-2.5 py-1 font-semibold">Kategori</a>
        </div>

        <!-- Tombol Aksi Kanan (Aksesibilitas & Buat Laporan) -->
        <div class="flex items-center gap-3.5">
            <!-- Tombol Pemicu Panel Aksesibilitas Cerdas -->
            <button id="btn-panel-aksesibilitas" 
                    class="flex items-center gap-2.5 px-4 py-2.5 border border-slate-200 text-slate-700 font-bold text-sm rounded-xl hover:bg-slate-50 hover:border-brand-500 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-2"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                    aria-controls="panel-aksesibilitas"
                    aria-label="Buka Panel Aksesibilitas Cerdas">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-600 panel-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <span class="hidden sm:inline">Aksesibilitas</span>
            </button>

            <!-- Tombol Shortcut Tulis Aspirasi -->
            <button onclick="toggleReportModal(true)"
                    class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-brand-100 hover:shadow-brand-200 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-2"
                    aria-label="Tulis Laporan Aspirasi Baru">
                Tulis Laporan
            </button>
        </div>

    </nav>
</header>
