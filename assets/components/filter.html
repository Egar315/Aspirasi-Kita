<!-- SECTION 3: FILTER KATEGORI (Penyaring Laporan Warga) -->
<section id="filter-kategori" class="mb-10" aria-labelledby="filter-heading">
    <!-- Search Bar -->
    <div class="search-wrapper">
        <div class="search-input-container">
            <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;min-width:18px;min-height:18px;flex-shrink:0;">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-laporan" class="search-input" placeholder="Cari laporan berdasarkan judul atau lokasi..." autocomplete="off" aria-label="Cari laporan" aria-controls="feed-aspirasi">
            <button class="search-clear-btn" id="search-clear" style="display:none" aria-label="Hapus pencarian">&#x2715;</button>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 border-b border-slate-200 pb-5">
        <div>
            <h2 id="filter-heading" class="text-2xl font-bold tracking-tight text-slate-900">Feed Aspirasi Warga</h2>
            <p class="text-sm text-slate-500 mt-1">Dukung pengaduan warga lainnya agar segera mendapatkan respon instansi pemerintah.</p>
        </div>
        
        <!-- Container untuk Tombol Filter (Bisa membungkus baris otomatis pada mobile demi kerapian visual) -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3 mt-4 md:mt-0 max-w-full" role="group" aria-label="Saring laporan berdasarkan kategori">
            <button class="btn-filter px-4 py-2 text-sm font-medium rounded-lg transition-all bg-brand-600 text-white shadow-md shadow-brand-100 hover:shadow active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-600" data-category="semua" aria-pressed="true">
                Semua Kategori
            </button>
            <button class="btn-filter px-4 py-2 text-sm font-medium rounded-lg transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-600" data-category="infrastruktur" aria-pressed="false">
                Infrastruktur
            </button>
            <button class="btn-filter px-4 py-2 text-sm font-medium rounded-lg transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-600" data-category="lingkungan" aria-pressed="false">
                Lingkungan
            </button>
            <button class="btn-filter px-4 py-2 text-sm font-medium rounded-lg transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-600" data-category="fasilitas-publik" aria-pressed="false">
                Fasilitas Publik
            </button>
            <button class="btn-filter px-4 py-2 text-sm font-medium rounded-lg transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-600" data-category="sosial" aria-pressed="false">
                Layanan Sosial
            </button>
        </div>
    </div>
</section>
