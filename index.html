<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspirasi-Kita - Portal Pengaduan Sosial & Fasilitas Publik</title>

    <!-- SEO Optimization -->
    <meta name="description"
        content="Portal pengaduan warga kota untuk melaporkan infrastruktur jalan rusak, pelayanan sosial, dan fasilitas publik secara terintegrasi dan inklusif.">
    <meta name="keywords"
        content="pengaduan masyarakat, fasilitas publik, layanan sosial, kebersihan lingkungan, ramah disabilitas">
    <meta name="author" content="Tim Developer Aspirasi-Kita">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(124, 58, 237, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02)',
                        'hover-premium': '0 20px 40px -15px rgba(124, 58, 237, 0.15), 0 1px 3px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS Stylesheet for Accessibility Engine -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-[#fafaff] text-slate-800 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Sub-Komponen Header (Pemuatan via JS) -->
    <div id="header-component"></div>

    <!-- ==========================================
         MAIN: Container Konten Dinamis Platform
         ========================================== -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10" role="main">

        <!-- Sub-Komponen Hero Banner (Pemuatan via JS) -->
        <div id="hero-component"></div>

        <!-- SECTION 2: FORM PELAPORAN (Kerangka Modal untuk Form Pengaduan) -->
        <section id="form-pelaporan" aria-labelledby="form-heading">
            <!-- Modal Container (Hidden by default, diaktifkan via JS toggleReportModal) -->
            <div id="modal-pelaporan" class="fixed inset-0 z-50 overflow-y-auto hidden" role="dialog" aria-modal="true"
                aria-labelledby="form-heading" aria-hidden="true">
                <!-- Overlay Belakang (Blur & Gelap) -->
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-md transition-opacity"
                    onclick="toggleReportModal(false)"></div>

                <!-- Konten Box Modal -->
                <div class="flex min-h-screen items-center justify-center p-4">
                    <div
                        class="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 transition-all transform scale-100">

                        <!-- Header Modal -->
                        <div
                            class="bg-gradient-to-r from-brand-600 to-indigo-600 text-white px-8 py-6 flex items-center justify-between">
                            <h2 id="form-heading" class="text-xl font-bold tracking-tight">Buat Laporan Aspirasi Baru
                            </h2>
                            <button onclick="toggleReportModal(false)"
                                class="p-1.5 rounded-xl text-white/80 hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white close-icon"
                                aria-label="Tutup Formulir Laporan">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        <!-- Form Isi Laporan -->
                        <form id="form-pengaduan" class="p-8 space-y-6">

                            <!-- Input Judul -->
                            <div class="space-y-1.5">
                                <label for="input-judul" class="block text-sm font-bold text-slate-700">Judul Laporan
                                    <span class="text-red-500" aria-hidden="true">*</span></label>
                                <input type="text" id="input-judul" required
                                    placeholder="Contoh: Lampu Jalan Raya Sudirman Mati"
                                    class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all focus:outline-none text-slate-800 placeholder-slate-400 font-medium"
                                    aria-required="true" aria-describedby="help-judul">
                                <p id="help-judul" class="text-xs text-slate-400">Buat judul laporan yang ringkas,
                                    jelas, dan menggambarkan masalah inti.</p>
                            </div>

                            <!-- Baris Kategori & Lokasi -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <!-- Pilihan Kategori -->
                                <div class="space-y-1.5">
                                    <label for="input-kategori" class="block text-sm font-bold text-slate-700">Kategori
                                        Aspirasi <span class="text-red-500" aria-hidden="true">*</span></label>
                                    <select id="input-kategori" required
                                        class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all focus:outline-none text-slate-800 font-medium bg-white">
                                        <option value="" disabled selected>Pilih Kategori</option>
                                        <option value="infrastruktur">Infrastruktur & Jalan</option>
                                        <option value="lingkungan">Kebersihan & Lingkungan</option>
                                        <option value="fasilitas-publik">Fasilitas Publik</option>
                                        <option value="sosial">Pelayanan Sosial & Keamanan</option>
                                    </select>
                                </div>

                                <!-- Input Lokasi -->
                                <div class="space-y-1.5">
                                    <label for="input-lokasi" class="block text-sm font-bold text-slate-700">Lokasi
                                        Kejadian <span class="text-red-500" aria-hidden="true">*</span></label>
                                    <input type="text" id="input-lokasi" required
                                        placeholder="Contoh: Jl. Sudirman KM 4, Jakarta"
                                        class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all focus:outline-none text-slate-800 placeholder-slate-400 font-medium"
                                        aria-required="true">
                                </div>
                            </div>

                            <!-- Input Deskripsi Detail -->
                            <div class="space-y-1.5">
                                <label for="input-deskripsi" class="block text-sm font-bold text-slate-700">Deskripsi
                                    Laporan Secara Detail <span class="text-red-500" aria-hidden="true">*</span></label>
                                <textarea id="input-deskripsi" rows="4" required
                                    placeholder="Jelaskan dengan detail apa permasalahannya, dampaknya bagi warga sekitar, dan saran perbaikan yang diharapkan..."
                                    class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all focus:outline-none text-slate-800 placeholder-slate-400 font-medium"
                                    aria-required="true" aria-describedby="help-deskripsi"></textarea>
                                <p id="help-deskripsi" class="text-xs text-slate-400">Sediakan informasi spesifik agar
                                    petugas mudah melakukan verifikasi.</p>
                            </div>

                            <!-- Footer Form / Submit Buttons -->
                            <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3.5">
                                <button type="button" onclick="toggleReportModal(false)"
                                    class="px-5 py-3.5 border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition-all focus:outline-none focus:ring-2 focus:ring-slate-300"
                                    aria-label="Batalkan Pengisian Laporan">
                                    Batal
                                </button>
                                <button type="submit"
                                    class="px-6 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg shadow-brand-100 transition-all focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-2"
                                    aria-label="Kirim Laporan Pengaduan">
                                    Kirim Laporan
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sub-Komponen Filter Kategori (Pemuatan via JS) -->
        <div id="filter-component"></div>

        <!-- SECTION 4: FEED ASPIRASI (Responsive Grid 1, 2, 3 Kolom) -->
        <section id="feed-aspirasi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8"
            aria-label="Kumpulan Laporan Warga">
            <!-- Isi laporan diisi secara dinamis melalui main.js -->
        </section>

    </main>

    <!-- Sub-Komponen Panel Aksesibilitas (Pemuatan via JS) -->
    <div id="accessibility-panel-component"></div>

    <!-- Sub-Komponen Footer (Pemuatan via JS) -->
    <div id="footer-component"></div>

    <!-- ==========================================
         SCRIPTS: Logika Aplikasi Utama & Aksesibilitas
         ========================================== -->
    <!-- Logika Utama -->
    <script src="assets/js/main.js"></script>
    <!-- Logika Mesin Aksesibilitas -->
    <script src="assets/js/accessibility.js"></script>

</body>

</html>
